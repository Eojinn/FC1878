spring:
  application:
    name: FC1878
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # 테이블은 Flyway가 만들고, JPA는 검증만
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start-only

jwt:
  # 운영에서는 반드시 환경변수 JWT_SECRET 으로 32바이트 이상 랜덤 값 주입
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-please-32bytes!!}
  access-token-validity-seconds: 3600

football:
  api:
    # 데이터 제공: football-data.org (무료 플랜: 주요 12개 대회 현재 시즌, 분당 10회, 스코어는 지연 제공)
    enabled: ${FOOTBALL_API_ENABLED:true}   # 키를 넣고 true 로 바꾸면 자동 동기화 시작
    base-url: https://api.football-data.org/v4
    key: ${FOOTBALL_API_KEY:}               # football-data.org 에서 받은 토큰 (환경변수로만 넣기)
    season: ${FOOTBALL_API_SEASON:2026}     # 순위 화면 기본 시즌 (2026-27 시즌 = 2026)
    # 대회 코드: PL 프리미어리그, PD 라리가, SA 세리에A, BL1 분데스리가, FL1 리그1, CL 챔피언스리그
    competitions: PL,PD,SA,BL1,FL1,CL
    fixture-sync-ms: 120000                 # 경기 동기화 주기 (2분, 요청 1회)
    standings-sync-ms: 10800000             # 순위 동기화 주기 (3시간, 대회 수만큼 요청)

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  prediction:
    win-point: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
