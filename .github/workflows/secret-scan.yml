# 깃허브에 올라온 커밋에 API 키·비밀 값이 있는지 검사 (push · PR 마다)
# 내 컴퓨터의 커밋 전 검사(.githooks/pre-commit)를 건너뛰었거나 설치 안 한 경우를 위한 두 번째 안전장치
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
