# 내 컴퓨터 전용 설정 예시
# 1) 이 파일을 프로젝트 루트의 config/application.yaml 로 복사하세요.  (config/ 폴더는 .gitignore 로 깃에 안 올라감)
#      PowerShell:  Copy-Item config-example\application.yaml config\application.yaml
# 2) 쓰려는 설정만 맨 앞의 # 을 지우고, 오른쪽 설명 대신 실제 값을 넣으세요.
#    (상위 줄의 # 도 같이 지워야 해요. 예: football: / api: / key: 세 줄)
#
# ⚠ 값이 없는 줄의 # 은 지우지 마세요. 이 파일의 값은 비어 있어도 기본 설정을 덮어써요.
#   예) "secret:" 을 빈칸으로 두면 JWT 키가 빈 값이 되어 서버가 켜지지 않아요.
# ⚠ 아래의 한글 설명을 지우지 않고 # 만 지우면 그 글자가 키로 쓰여서 동작하지 않아요.

# football:
#   api:
#     key: football-data.org_토큰_32자            # 영문·숫자로 된 토큰으로 바꾸기

# jwt:
#   secret: 32자_이상_아무_문자열                  # 안 쓰면 개발용 기본값 사용

# app:
#   AI:
#     api-key: 여기에_AI_Studio_키                  # AI 챗봇용 (영문·숫자 키로 바꾸기)
#     model: 모델 이름
#   news:
#     naver-client-id: 네이버_API_허브_Client_ID
#     naver-client-secret: 네이버_API_허브_Client_Secret
#   oauth:
#     google:
#       client-id: 구글_Client_ID
#       client-secret: 구글_Client_Secret
#     kakao:
#       client-id: 카카오_REST_API_키
#       client-secret: 카카오_Client_Secret
